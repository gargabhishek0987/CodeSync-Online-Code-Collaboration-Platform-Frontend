<div class="auth-container min-vh-100 d-flex align-items-center justify-content-center position-relative overflow-hidden">
  <!-- Decorative background elements -->
  <div class="position-absolute top-0 end-0 translate-middle rounded-circle bg-secondary opacity-25 blur-3xl" style="width: 450px; height: 450px; filter: blur(70px);"></div>
  <div class="position-absolute bottom-0 start-0 translate-middle-y rounded-circle bg-primary opacity-25 blur-3xl" style="width: 350px; height: 350px; filter: blur(60px);"></div>

  <div class="glass-card p-4 p-md-5 auth-card animate-fade-in shadow-2xl position-relative z-1" style="max-width: 450px; width: 100%; border: 1px solid rgba(255,255,255,0.1);">
    <div class="text-center mb-5">
      <div class="d-inline-flex bg-secondary bg-opacity-10 p-3 rounded-circle text-secondary mb-3 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
          <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
          <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5v11z"/>
        </svg>
      </div>
      <h2 class="fw-bolder gradient-text display-6 mb-2">Create Account</h2>
      <p class="text-muted">Join the CodeSync community today</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="mb-4">
        <label class="form-label text-light fw-medium small mb-2">Username</label>
        <input type="text" name="username" class="form-control form-control-lg bg-dark text-white border-secondary focus-ring-primary transition-all" [(ngModel)]="user.username" required placeholder="Choose a username">
      </div>

      <div class="mb-4">
        <label class="form-label text-light fw-medium small mb-2">Email Address</label>
        <input type="email" name="email" class="form-control form-control-lg bg-dark text-white border-secondary focus-ring-primary transition-all" [(ngModel)]="user.email" required placeholder="name@company.com">
      </div>
      
      <div class="mb-4">
        <label class="form-label text-light fw-medium small mb-2">Password</label>
        <input type="password" name="password" class="form-control form-control-lg bg-dark text-white border-secondary focus-ring-primary transition-all" [(ngModel)]="user.password" required placeholder="••••••••">
      </div>

      <div *ngIf="error" class="alert bg-danger bg-opacity-10 border border-danger text-danger py-3 small mb-4 rounded-3 d-flex align-items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/></svg>
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 mb-4 rounded-pill fw-bold shadow position-relative overflow-hidden group" [disabled]="loading || !registerForm.valid">
        <span class="position-relative z-1 d-flex align-items-center justify-content-center gap-2">
          {{ loading ? 'Creating Account...' : 'Sign Up Free' }}
          <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="transition-all group-hover-translate-x" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z"/>
          </svg>
        </span>
      </button>

      <div class="d-flex align-items-center mb-4 text-muted small">
        <div class="flex-grow-1 border-bottom border-secondary opacity-25"></div>
        <span class="px-3">or join with</span>
        <div class="flex-grow-1 border-bottom border-secondary opacity-25"></div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6">
          <button type="button" (click)="socialLogin('google')" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 rounded-3 border-secondary opacity-75 hover-opacity-100 transition-all text-white text-decoration-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0c2.158 0 3.92.759 5.236 2.01l-2.227 2.227C10.104 3.428 9.176 3 8 3c-2.459 0-4.456 1.997-4.456 4.456s1.997 4.456 4.456 4.456c1.603 0 2.871-.531 3.738-1.391.802-.801 1.29-1.954 1.29-3.418a1 1 0 0 1 .054-.351h.003h-5.04v-2.19h7.093z"/>
            </svg>
            Google
          </button>
        </div>
        <div class="col-6">
          <button type="button" (click)="socialLogin('github')" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 rounded-3 border-secondary opacity-75 hover-opacity-100 transition-all text-white text-decoration-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
            </svg>
            GitHub
          </button>
        </div>
      </div>

      <p class="text-center text-muted mb-0">
        Already have an account? <a routerLink="/login" class="text-primary text-decoration-none fw-semibold border-bottom border-primary border-opacity-50 pb-1 hover-border-opacity-100 transition-all">Sign In</a>
      </p>
    </form>
  </div>
</div>
